<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN من - نسخه واقعی</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none; /* جلوگیری از انتخاب متن */
        }

        body {
            background-color: #12121c;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.5s ease;
        }

        .app-container {
            background: linear-gradient(145deg, #1f1f38, #16162a);
            width: 100%;
            max-width: 400px;
            border-radius: 25px;
            padding: 25px 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo {
            background: linear-gradient(135deg, #6b5bff, #a084ff);
            width: 45px;
            height: 45px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(107, 91, 255, 0.3);
        }

        /* دکمه اتصال */
        .connect-btn {
            background: linear-gradient(135deg, #4a4a6a, #3a3a5a); /* حالت قطع */
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            color: white;
            font-size: 1.2rem;
            position: relative;
            box-shadow: 0 0 0 rgba(107, 91, 255, 0);
        }

        .connect-btn:active {
            transform: scale(0.95);
        }

        /* حالت در حال اتصال */
        .connect-btn.connecting {
            background: linear-gradient(135deg, #ffaa00, #ffcc00);
            box-shadow: 0 0 50px rgba(255, 170, 0, 0.5);
            animation: pulse 1.5s infinite;
        }

        /* حالت متصل */
        .connect-btn.connected {
            background: linear-gradient(135deg, #00c853, #00e676);
            box-shadow: 0 0 50px rgba(0, 200, 83, 0.5);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 170, 0, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 170, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 170, 0, 0); }
        }

        .connect-btn span.icon {
            font-size: 2.8rem;
            margin-bottom: 5px;
            transition: transform 0.3s;
        }

        .connect-btn.connected span.icon {
            transform: rotate(90deg); /* چرخش دوشاخه در حالت اتصال */
        }

        .status-text {
            color: #a0a0b0;
            font-size: 0.95rem;
            margin-bottom: 30px;
            height: 20px;
            transition: color 0.3s;
        }

        .status-text.active {
            color: #00e676;
            font-weight: bold;
        }

        .status-text.connecting-text {
            color: #ffaa00;
        }

        /* کارت سرور */
        .server-card {
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .server-card:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .server-info {
            text-align: right;
        }

        .server-info p:first-child {
            font-size: 0.75rem;
            color: #a0a0b0;
            margin-bottom: 5px;
        }

        .server-info p:last-child {
            font-size: 1.05rem;
            font-weight: bold;
        }

        .arrow {
            color: #a0a0b0;
            font-size: 1.2rem;
        }

        /* آمار سرعت */
        .stats-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: border-color 0.3s;
        }

        .stat-box.active {
            border-color: rgba(0, 200, 83, 0.3);
        }

        .stat-box .label {
            font-size: 0.75rem;
            color: #a0a0b0;
        }

        .stat-box .value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
            transition: color 0.3s;
        }

        .stat-box.active .value {
            color: #00e676;
        }

        .stat-box .unit {
            font-size: 0.7rem;
            color: #a0a0b0;
        }

        /* بخش IP و پینگ */
        .ip-info {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: #a0a0b0;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .ip-info.visible {
            opacity: 1;
        }

        .ip-info span {
            color: #fff;
            font-weight: bold;
            direction: ltr; /* برای نمایش صحیح IP */
        }

        /* دکمه‌های پایین */
        .bottom-buttons {
            display: flex;
            gap: 15px;
        }

        .bottom-btn {
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 15px;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .bottom-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* اسپینر */
        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 5px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .connect-btn.connecting .spinner {
            display: block;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="logo">🔒</div>
            <h1>VPN من</h1>
        </div>

        <!-- دکمه اتصال -->
        <button class="connect-btn" id="connectBtn" onclick="toggleConnect()">
            <div class="spinner"></div>
            <span class="icon" id="btnIcon">🔌</span>
            <span id="connectText">اتصال</span>
        </button>

        <p class="status-text" id="statusText">آماده برای اتصال</p>

        <!-- IP و پینگ (مخفی در ابتدا) -->
        <div class="ip-info" id="ipInfo">
            <div>IP شما: <span id="ipValue">---.---.---.---</span></div>
            <div>پینگ: <span id="pingValue">-- ms</span></div>
        </div>

        <!-- کارت سرور -->
        <div class="server-card" onclick="changeServer()">
            <div class="server-info">
                <p>سرور انتخاب شده</p>
                <p id="serverName">آلمان - فرانکفورت 🇩🇪</p>
            </div>
            <div class="arrow">‹</div>
        </div>

        <!-- آمار -->
        <div class="stats-row">
            <div class="stat-box" id="uploadBox">
                <span class="label">آپلود ⬆️</span>
                <div>
                    <span class="value" id="uploadSpeed">0</span>
                    <span class="unit">KB/s</span>
                </div>
            </div>
            <div class="stat-box" id="downloadBox">
                <span class="label">دانلود ⬇️</span>
                <div>
                    <span class="value" id="downloadSpeed">0</span>
                    <span class="unit">KB/s</span>
                </div>
            </div>
        </div>

        <!-- دکمه‌های پایین -->
        <div class="bottom-buttons">
            <button class="bottom-btn" onclick="alert('آمار مصرف شما:\nدانلود کل: 1.2 GB\nآپلود کل: 340 MB')">📊 آمار</button>
            <button class="bottom-btn" onclick="alert('تنظیمات: به زودی...')">⚙️ تنظیمات</button>
        </div>
    </div>

    <script>
        // --- متغیرهای سراسری ---
        let state = 'disconnected'; // disconnected, connecting, connected
        let speedInterval = null;
        let pingInterval = null;

        // المان‌های DOM
        const btn = document.getElementById('connectBtn');
        const btnIcon = document.getElementById('btnIcon');
        const connectText = document.getElementById('connectText');
        const statusText = document.getElementById('statusText');
        const ipInfo = document.getElementById('ipInfo');
        const ipValue = document.getElementById('ipValue');
        const pingValue = document.getElementById('pingValue');
        const uploadSpeed = document.getElementById('uploadSpeed');
        const downloadSpeed = document.getElementById('downloadSpeed');
        const uploadBox = document.getElementById('uploadBox');
        const downloadBox = document.getElementById('downloadBox');

        // لیست سرورها برای تغییر
        const servers = [
            "آلمان - فرانکفورت 🇩🇪",
            "هلند - آمستردام 🇳🇱",
            "ترکیه - استانبول 🇹🇷",
            "آمریکا - نیویورک 🇺🇸",
            "فرانسه - پاریس 🇫🇷"
        ];
        let currentServerIndex = 0;

        // --- تابع اصلی تغییر وضعیت ---
        function toggleConnect() {
            if (state === 'disconnected') {
                startConnecting();
            } else if (state === 'connected') {
                disconnect();
            }
            // اگر در حال اتصال بود، هیچ کاری نکن (تا تاخیر تمام شود)
        }

        // --- شروع فرآیند اتصال (شبیه‌سازی Handshake) ---
        function startConnecting() {
            state = 'connecting';
            
            // تغییر ظاهر دکمه
            btn.classList.remove('connected');
            btn.classList.add('connecting');
            btnIcon.style.display = 'none'; // مخفی کردن دوشاخه
            connectText.innerText = 'در حال اتصال...';
            statusText.innerText = 'در حال برقراری ارتباط با سرور...';
            statusText.className = 'status-text connecting-text';
            ipInfo.classList.remove('visible'); // مخفی کردن IP تا اتصال کامل

            // تاخیر ۲.۵ ثانیه‌ای برای شبیه‌سازی واقعی بودن
            setTimeout(() => {
                if (state === 'connecting') {
                    completeConnection();
                }
            }, 2500);
        }

        // --- تکمیل اتصال ---
        function completeConnection() {
            state = 'connected';

            // تغییر ظاهر دکمه به سبز
            btn.classList.remove('connecting');
            btn.classList.add('connected');
            btnIcon.style.display = 'block';
            btnIcon.innerText = '🔓'; // قفل باز
            connectText.innerText = 'قطع';
            
            statusText.innerText = 'متصل - امن';
            statusText.className = 'status-text active';

            // نمایش IP و پینگ
            ipInfo.classList.add('visible');
            generateFakeIP();
            updatePing();

            // فعال کردن استایل سبز برای باکس‌های سرعت
            uploadBox.classList.add('active');
            downloadBox.classList.add('active');

            // شروع شبیه‌سازی نوسان سرعت
            startSpeedFluctuation();
            
            // شروع به‌روزرسانی پینگ هر ۵ ثانیه
            pingInterval = setInterval(updatePing, 5000);
        }

        // --- قطع اتصال ---
        function disconnect() {
            state = 'disconnected';
            clearInterval(speedInterval);
            clearInterval(pingInterval);

            // برگرداندن ظاهر به حالت اول
            btn.classList.remove('connected', 'connecting');
            btnIcon.innerText = '🔌';
            connectText.innerText = 'اتصال';
            statusText.innerText = 'آماده برای اتصال';
            statusText.className = 'status-text';
            
            ipInfo.classList.remove('visible');
            uploadBox.classList.remove('active');
            downloadBox.classList.remove('active');
            
            uploadSpeed.innerText = '0';
            downloadSpeed.innerText = '0';
        }

        // --- شبیه‌سازی نوسان سرعت ---
        function startSpeedFluctuation() {
            speedInterval = setInterval(() => {
                if (state !== 'connected') return;

                // تولید عدد رندوم برای دانلود (بین 200 تا 2500)
                const dl = Math.floor(Math.random() * 2300) + 200;
                // تولید عدد رندوم برای آپلود (بین 50 تا 800)
                const ul = Math.floor(Math.random() * 750) + 50;

                downloadSpeed.innerText = dl;
                uploadSpeed.innerText = ul;
            }, 1000); // هر ۱ ثانیه آپدیت شود
        }

        // --- تولید IP ساختگی ---
        function generateFakeIP() {
            // IP آلمان معمولاً با 85 یا 185 شروع می‌شود
            const ip = `185.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}`;
            ipValue.innerText = ip;
        }

        // --- به‌روزرسانی پینگ ---
        function updatePing() {
            const ping = Math.floor(Math.random() * 40) + 15; // بین 15 تا 55 میلی‌ثانیه
            pingValue.innerText = `${ping} ms`;
        }

        // --- تغییر سرور ---
        function changeServer() {
            if (state === 'connected') {
                alert('لطفاً ابتدا اتصال را قطع کنید تا سرور را تغییر دهید.');
                return;
            }
            currentServerIndex = (currentServerIndex + 1) % servers.length;
            document.getElementById('serverName').innerText = servers[currentServerIndex];
        }
    </script>

</body>
                                 </html>
